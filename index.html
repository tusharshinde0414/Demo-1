<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Survey Form</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1 id="title">freeCodeCamp Survey Form</h1>
    <p id="description">
      Thank you for taking the time to help us improve the platform.
    </p>
    <form id="survey-form">
      <!-- Name Input -->
      <label id="name-label" for="name">Name:</label>
      <input id="name" type="text" placeholder="Enter your name" required />

      <!-- Email Input -->
      <label id="email-label" for="email">Email:</label>
      <input id="email" type="email" placeholder="Enter your email" required />

      <!-- Age Input -->
      <label id="number-label" for="number">Age:</label>
      <input
        id="number"
        type="number"
        min="18"
        max="120"
        placeholder="Enter your age"
      />

      <!-- Dropdown -->
      <label for="dropdown">Which option best describes you?</label>
      <select id="dropdown">
        <option value="student">Student</option>
        <option value="full-time-job">Full Time Job</option>
      </select>

      <!-- Radio Buttons -->
      <p>Would you recommend freeCodeCamp to a friend?</p>
      <label
        ><input type="radio" name="recommend" value="Definitely" />
        Definitely</label
      >
      <label><input type="radio" name="recommend" value="Maybe" /> Maybe</label>
      <label
        ><input type="radio" name="recommend" value="Not Sure" /> Not
        Sure</label
      >

      <!-- Checkbox Group -->
      <fieldset>
        <legend>What would you like to see improved?</legend>
        <label
          ><input
            id="front-end"
            type="checkbox"
            name="field"
            value="Front-end"
          />
          Front-end Projects</label
        >
        <label
          ><input id="back-end" type="checkbox" name="field" value="Back-end" />
          Back-end Projects</label
        >
        <label
          ><input id="data" type="checkbox" name="field" value="Data" /> Data
          Visualization</label
        >
      </fieldset>

      <!-- Textarea -->
      <label for="comments">Any comments or suggestions?</label>
      <textarea id="comments" placeholder="Enter your comments here"></textarea>

      <!-- Submit Button -->
      <button id="submit" type="submit">Submit</button>
    </form>
  </body>
</html>
